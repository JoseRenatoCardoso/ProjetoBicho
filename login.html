<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acesse sua conta no Projeto Bicho — ONG de proteção animal de Bandeirantes/PR.">
  <title>Login — Projeto Bicho</title>
  <link rel="stylesheet" href="auth.css">
</head>

<body>

  <main class="pagina-autenticacao">

    <section class="imagem-autenticacao" aria-label="Imagem de animal resgatado">
      <img src="img/auth-bg.png"
        alt="Pessoa segurando um filhote de cachorro resgatado, transmitindo carinho e esperança"
        class="imagem-autenticacao-foto" loading="eager">
      <blockquote class="imagem-autenticacao-citacao">
        Bem-vindo de volta. Os animais contam com você.
      </blockquote>
    </section>

    <section class="painel-form-autenticacao" aria-label="Formulário de login">

      <a href="index.html" class="voltar-autenticacao" aria-label="Voltar ao site principal">
        <span class="voltar-autenticacao-seta" aria-hidden="true">←</span>
        Voltar ao site
      </a>

      <div class="container-form-autenticacao">

        <h1 class="form-autenticacao-titulo">Entrar</h1>
        <p class="form-autenticacao-subtitulo">
          Acesse sua conta no Projeto Bicho.
        </p>

        <form class="form-autenticacao" action="index.html" method="GET">

          <div class="form-group">
            <label for="login-email">E-mail</label>
            <input type="email" id="login-email" name="email" placeholder="seu@email.com" autocomplete="email" required>
          </div>

          <div class="form-group">
            <label for="login-senha">Senha</label>
            <input type="password" id="login-senha" name="senha" placeholder="Sua senha" autocomplete="current-password"
              required>
          </div>

          <button type="submit" class="btn-submit">
            Entrar
          </button>

        </form>

        <p class="form-autenticacao-footer">
          Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
        </p>
        <img src="img/icons/paw-solid-full.svg" alt="" class="pata-autenticacao svg-icon svg-primary"
          aria-hidden="true">

      </div>

    </section>

  </main>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Painel de administração do Projeto Bicho — gerencie os usuários cadastrados na ONG de proteção animal de Bandeirantes/PR.">
  <title>Administração — Projeto Bicho</title>
  <link rel="stylesheet" href="auth.css">
</head>

<body>

  <main class="pagina-autenticacao">

    <section class="imagem-autenticacao" aria-label="Imagem de animal resgatado">
      <img src="img/auth-bg.png"
        alt="Pessoa segurando um filhote de cachorro resgatado, transmitindo carinho e esperança"
        class="imagem-autenticacao-foto" loading="eager">
      <blockquote class="imagem-autenticacao-citacao">
        Gerenciando quem faz a diferença.
      </blockquote>
    </section>

    <section class="painel-form-autenticacao painel-adm" aria-label="Painel de administração">

      <a href="index.html" class="voltar-autenticacao" aria-label="Voltar ao site principal">
        <span class="voltar-autenticacao-seta" aria-hidden="true">←</span>
        Voltar ao site
      </a>

      <div class="container-form-autenticacao container-adm">

        <h1 class="form-autenticacao-titulo">Administração</h1>
        <p class="form-autenticacao-subtitulo">
          Gerencie os usuários cadastrados no Projeto Bicho.
        </p>

        <form class="form-autenticacao" id="form-adm" aria-label="Cadastrar novo usuário">

          <div class="form-group">
            <label for="adm-nome">Nome</label>
            <input type="text" id="adm-nome" name="nome" placeholder="Nome do usuário" autocomplete="name"
              maxlength="100" required>
          </div>

          <div class="form-group">
            <label for="adm-email">E-mail</label>
            <input type="email" id="adm-email" name="email" placeholder="email@exemplo.com" autocomplete="email"
              maxlength="254" required>
          </div>

          <div class="form-botoes">
            <button type="submit" class="btn-submit" id="btn-cadastrar">
              Cadastrar
            </button>
            <button type="button" class="btn-limpar" id="btn-limpar">
              Limpar
            </button>
          </div>

        </form>

        <div class="secao-pesquisa" role="search" aria-label="Pesquisar usuários">
          <input type="text" id="campo-pesquisa" class="campo-pesquisa" placeholder="Pesquisar por nome..."
            aria-label="Pesquisar por nome">
          <button type="button" class="btn-excluir-todos" id="btn-excluir-todos">
            Excluir Todos
          </button>
        </div>

        <ul id="lista-usuarios" class="lista-usuarios" aria-label="Lista de usuários cadastrados"></ul>
        <p id="lista-vazia" class="lista-vazia">Nenhum usuário cadastrado.</p>

        <img src="img/icons/paw-solid-full.svg" alt="" class="pata-autenticacao svg-icon svg-primary"
          aria-hidden="true">

      </div>

    </section>

  </main>

  <div id="modal-container"></div>

  <div id="notificacao-container" class="notificacao-container" aria-live="polite"></div>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/adm.js"></script>

</body>

</html>
